# Current journal classifications, rather than publication-year classifications.
# Reviewed 2026-11-21. Omitted grades mean not found in the referenced edition.
# Chinese journals' CSSCI status is confirmed by the author.
systems:
  ccf:
    label: CCF
    title: CCF recommended international journals, seventh edition (2026)
    url: https://www.ccf.org.cn/Academic_Evaluation/By_category/
  fms:
    label: FMS
    title: FMS Journal Rating Guide 2025
    url: https://www.fms-journal.net/
    international_list: https://www.fms-journal.net/download_pdf
    chinese_list: https://www.fms-journal.net/download_cn_pdf
  abs:
    label: ABS
    title: ABS Academic Journal Guide 2024
    url: https://charteredabs.org/academic-journal-guide/academic-journal-guide-2024
    reference_copy: https://mse.bistu.edu.cn/docs/2025-09/dbc156cd13124e25bfeda2db9dd3d1e2.xlsx
  sci:
    label: SCI
    title: Science Citation Index Expanded (SCIE)
  ssci:
    label: SSCI
    title: Social Sciences Citation Index
  cssci:
    label: CSSCI
    title: Chinese Social Sciences Citation Index
    url: https://cssci.nju.edu.cn/
  ei:
    label: EI
    title: Engineering Index (Compendex)

